name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# O site vive na Cloudflare (wrangler.jsonc); o GitHub Pages foi desligado a 26
# set 2026 -- os termos dele proíbem lojas. O token só precisa de ler o repo.
permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # AS FOTOGRAFIAS QUE A DONA JUNTA NO PAINEL chegam aqui só como o
      # original (photos/<marca>/<pasta>/<nome>.jpg): as versões web geram-se
      # aqui, e não vão para o git. As do estúdio estão no git e ficam como
      # estão (o renditions.py salta o que já existe). As do painel, num
      # checkout novo, NÃO existem -- e sem mais nada refaziam-se todas em cada
      # publicação, uns 2,5 s por fotografia, para sempre. Por isso ficam numa
      # cache entre corridas: cada fotografia paga uma vez.
      # (O cards.py recorta todos os originais em cada corrida -- 1,5 s para
      # cem -- e os masters não entram na cache: um master guardado nunca é
      # lido antes de ser escrito outra vez, e só servia para fazer voltar uma
      # fotografia que a dona tirou.)
      # Pillow fixo em 11.3: é a versão com AVIF de origem e a que gerou as
      # que estão no repositório.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A CHAVE tem duas partes. A primeira são os scripts e o focus.json:
      # mudá-los muda as versões, e então não se restaura nada e refaz-se tudo
      # uma vez. A segunda são os originais: uma fotografia nova restaura a
      # cache da corrida anterior (pelo prefixo) e só gera as dela.
      - name: Restore the web versions made on earlier runs
        id: versoes
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/versoes
          key: versoes-v1-${{ hashFiles('scripts/cards.py', 'scripts/renditions.py', 'photos/focus.json') }}-${{ hashFiles('photos/**/*.jpg', '!photos/_cards/**', '!photos/_contact/**') }}
          restore-keys: |
            versoes-v1-${{ hashFiles('scripts/cards.py', 'scripts/renditions.py', 'photos/focus.json') }}-

      # O QUE O GIT TEM GANHA SEMPRE: a cache só junta o que falta, e guarda
      # só o que o git não tem. Uma versão que o programador refez e gravou no
      # git nunca é tapada por uma cópia velha, e uma que ele apagou não volta.
      # As de uma fotografia que a dona tirou saem no renditions.py (não têm
      # original), e o check-output confere que saíram.
      # cards.py e renditions.py passam à frente de um original que não abre
      # e avisam: quem decide se alguma página precisa dele são as guardas.
      # O share.py faz o cartão de partilha (og:image, com o logótipo) das capas
      # que o git não tem -- as das fotografias juntas no painel -- a partir da
      # versão web que o renditions.py acabou de escrever, e tira os cartões
      # de capas que mudaram. Os das fotografias do estúdio estão no git e
      # ficam. Não vão para a cache: são uns 40 ms cada.
      - name: Photographs added in the back office
        env:
          VERSOES: ${{ runner.temp }}/versoes
        run: |
          if [ -d "$VERSOES" ]; then rsync -a --ignore-existing "$VERSOES/" ./; fi
          python3 -m pip install --quiet Pillow==11.3.0
          python3 scripts/cards.py
          python3 scripts/renditions.py
          python3 scripts/share.py
          rm -rf "$VERSOES" && mkdir -p "$VERSOES"
          git -c core.quotePath=false ls-files --others --exclude-standard -- public/media/ithos public/media/cathelier public/media/whole \
            | rsync -a --files-from=- ./ "$VERSOES/"
          echo "$(find "$VERSOES" -type f | wc -l | tr -d ' ') web versions of back-office photographs kept for the next run"

      # Guarda-se logo, e não no fim do trabalho: uma guarda que pára a
      # publicação por outra razão não deita fora as versões já feitas.
      - name: Keep them for the next run
        if: steps.versoes.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/versoes
          key: ${{ steps.versoes.outputs.cache-primary-key }}

      # O VÍDEO DO CARTÃO: uma cópia pequena de cada vídeo (8 s, 3:4, 540 px,
      # sem som, uns 300 KB), para o rato por cima do cartão começar logo
      # (scripts/videos-cartao.mjs). Não estão no git: ficam numa cache entre
      # corridas, e só um vídeo novo paga o ffmpeg (instalado só nesse caso).
      # A chave muda com o script (refaz-se tudo) e com os vídeos (restaura a
      # anterior pelo prefixo e faz só os novos; as de vídeos tirados saem).
      # Se falhar, a construção usa o vídeo inteiro: publica-se na mesma.
      - name: Restore the card videos made on earlier runs
        id: cartoes
        uses: actions/cache/restore@v4
        with:
          path: public/media/video-cartao
          key: videos-cartao-v1-${{ hashFiles('scripts/videos-cartao.mjs') }}-${{ hashFiles('public/media/video/**/*.mp4', 'public/media/video/**/*.webm') }}
          restore-keys: |
            videos-cartao-v1-${{ hashFiles('scripts/videos-cartao.mjs') }}-

      - name: Card videos
        run: |
          if [ "$(node scripts/videos-cartao.mjs --falta)" != "0" ] && ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null || echo "sem ffmpeg: os cartões usam os vídeos inteiros"
          fi
          node scripts/videos-cartao.mjs || echo "as cópias dos cartões falharam: os cartões usam os vídeos inteiros"

      - name: Keep the card videos for the next run
        if: steps.cartoes.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: public/media/video-cartao
          key: ${{ steps.cartoes.outputs.cache-primary-key }}

      # The guards run BEFORE the build and are allowed to kill it. A shop
      # published without the seller's legal identification on it is worse than
      # a shop that does not publish.
      - name: Guards
        run: node scripts/guards.mjs
        env:
          PREVIEW: ${{ vars.PREVIEW || 'yes' }}

      # BASE_PATH stays set until the domain's DNS points here. Clear the
      # repository variable (or set it empty) on the day it does, and the same
      # build produces root-relative paths and writes the CNAME file.
      - name: Build
        run: node src/build.mjs
        env:
          PREVIEW: ${{ vars.PREVIEW || 'yes' }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          API_URL: ${{ vars.API_URL }}

      - name: Check what came out
        run: node scripts/check-output.mjs
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
          PREVIEW: ${{ vars.PREVIEW || 'yes' }}

      # A PASTA public/ VAI PARA A CLOUDFLARE: o Worker só de ficheiros de
      # wrangler.jsonc, servido em ithos-cathelier.pt pela route de lá.
      # Precisa do segredo CLOUDFLARE_API_TOKEN (modelo «Edit Cloudflare
      # Workers», limitado à zona, criado pelo dono da conta) e da variável
      # CLOUDFLARE_ACCOUNT_ID. Sem eles, falha -- e é bom que falhe: não há
      # outro sítio para onde publicar.
      - name: Publish on Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.141.0'
          command: deploy
