name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # AS FOTOGRAFIAS QUE A DONA JUNTA NO PAINEL chegam aqui só como o
      # original (photos/<marca>/<pasta>/<nome>.jpg): as versões web geram-se
      # agora, e não vão para o git. As que já estavam estão em public/media e
      # ficam como estão -- os dois scripts saltam o que já existe, por isso
      # isto custa uns segundos por fotografia nova e não refaz nada.
      # Pillow fixo em 11.3: é a versão com AVIF de origem e a que gerou as
      # que estão no repositório.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Photographs added in the back office
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 scripts/cards.py
          python3 scripts/renditions.py

      # The guards run BEFORE the build and are allowed to kill it. A shop
      # published without the seller's legal identification on it is worse than
      # a shop that does not publish.
      - name: Guards
        run: node scripts/guards.mjs
        env:
          PREVIEW: ${{ vars.PREVIEW || 'yes' }}

      # BASE_PATH stays set until the domain's DNS points here. Clear the
      # repository variable (or set it empty) on the day it does, and the same
      # build produces root-relative paths and writes the CNAME file.
      - name: Build
        run: node src/build.mjs
        env:
          PREVIEW: ${{ vars.PREVIEW || 'yes' }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          API_URL: ${{ vars.API_URL }}

      - name: Check what came out
        run: node scripts/check-output.mjs
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
          PREVIEW: ${{ vars.PREVIEW || 'yes' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
