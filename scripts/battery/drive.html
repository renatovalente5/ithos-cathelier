<!doctype html><meta charset=utf-8><title>bateria</title>
<body style="font:13px/1.5 ui-monospace,monospace;padding:1rem">
<div id=saida>a correr…</div>
<script type=module>
const PAGINAS = ['/','/lamps/','/lamps/fox/','/lamps/mushroom/',
 '/cathelier/','/cathelier/christmas/','/cathelier/keepsakes/','/cathelier/pieces/',
 '/cathelier/pieces/growth-chart/','/cathelier/pieces/engraved-bauble/',
 '/cart/','/contact/','/about/','/cathelier/about/','/cathelier/quote/',
 '/thank-you/','/order-cancelled/','/care-and-safety/','/legal/terms/','/legal/privacy/','/legal/cancellation/',
 '/legal/shipping-and-returns/','/legal/identification/','/legal/returns-form/','/404.html'];
window.__resultados = {};
const saida = document.getElementById('saida');
const L = Number(new URLSearchParams(location.search).get('w') || 1280);

/* A ALTURA importa tanto como a largura, e durante todo o projecto foi 900.
 *
 * A verificação «o menu de telemóvel cabe no ecrã sem rolar» compara o
 * conteúdo da gaveta com `innerHeight` DENTRO do iframe. Com o iframe sempre
 * a 900 px, essa comparação era `578 <= 901`: verdadeira para qualquer
 * telemóvel que exista. A guarda não podia falhar, e por isso não falhou —
 * enquanto a gaveta da cathelier transborda hoje, em produção, num ecrã de
 * 568 px.
 *
 * Cada largura passa a trazer a altura do aparelho que ela representa. É a
 * segunda vez neste projecto que uma guarda mede contra um número escolhido
 * por conveniência e devolve um ✓ sobre o que nunca viu. */
/* 1366x640 é o caso mais apertado que existe e ninguém o conduzia: a media
   query de compactação é `(height < 40rem)`, que NÃO casa em 640 exactos, e o
   conteúdo em repouso do painel cathelier mede 599px. Quarenta e um pixels de
   folga, sem guarda nenhuma até aqui. */
const ALTURAS = { 320: 568, 375: 667, 390: 844, 768: 1024, 1280: 800, 1366: 640, 1440: 900 };
const A = Number(new URLSearchParams(location.search).get('h') || ALTURAS[L] || 900);

/* O carrinho é SEMEADO antes de começar.
 *
 * Com o carrinho vazio, `/carrinho/` e `/encomenda/` são duas páginas com uma
 * frase cada, e a bateria dava-as por boas durante três larguras seguidas. Só
 * quando um teste manual deixou dois artigos no `localStorage` é que
 * apareceram as ligações de 19 px que faltavam à norma dos alvos de toque.
 * Uma peça de cada marca, para o agrupamento por marca também ser pintado. */
const CESTO = 'ic-basket-v1';
const guardado = localStorage.getItem(CESTO);
localStorage.setItem(CESTO, JSON.stringify({
  country: 'PT',
  lines: [
    { id: 'fox', qty: 1, options: { power: 'batteries' } },
    { id: 'save-the-date', qty: 2, options: { engraving: 'Ana and John · 12.09.2027' } },
  ],
}));
// E respondido o aviso de cookies: senão tapa o fundo de todas as páginas e
// as medidas de contraste e de alvos leem-no a ele em vez do conteúdo.
// no cookie banner on this build: there is nothing to consent to
addEventListener('beforeunload', () => {
  if (guardado) localStorage.setItem(CESTO, guardado); else localStorage.removeItem(CESTO);
});
/* A ORIGEM também é um parâmetro, e não era.
 *
 * A bateria sempre conduziu o `localhost`, onde o prefixo de endereço é vazio.
 * A versão publicada vive debaixo de uma pasta e tem endereços diferentes — e
 * foi exactamente aí que oito @font-face saíram sem prefixo e todas as
 * tipografias 404aram, com a verificação «tipo carregado» a passar em verde no
 * local. Verificar contra um endereço diferente daquele para onde se publica
 * não é verificar.
 *
 *   /_drive.html?w=390                          o site local
 *   /_drive.html?w=390&base=/ithos-cathelier    o mesmo HTML publicado
 */
const BASE = (new URLSearchParams(location.search).get('base') || '').replace(/\/$/, '');

for (const pag of PAGINAS) {
  const f = document.createElement('iframe');
  f.style.cssText = `width:${L}px;height:${A}px;border:0;position:absolute;left:-9999px`;
  f.src = BASE + pag;
  document.body.appendChild(f);
  await new Promise(r => { f.onload = r; setTimeout(r, 4000); });
  await new Promise(r => setTimeout(r, 900));

  /* A fotografia da capa, descodificada aqui e entregue à bateria.
   *
   * A verificação do contraste da capa desenha a fotografia numa tela, e uma
   * tela vazia não tem cor nenhuma — mediria o painel sobre preto e diria que
   * está tudo bem. Mas não se pode esperar pela própria `<img>` da página:
   * numa moldura fora do ecrã o browser troca de candidato do `srcset` a meio
   * e fica com `complete` a verdade e `naturalWidth` a zero, e assim ficou
   * seis segundos seguidos nas duas corridas em que isto foi medido.
   *
   * Uma imagem NOVA com o mesmo endereço, sem `srcset`, descodifica à
   * primeira. É essa que a bateria usa; a `<img>` da página continua a dar a
   * geometria, que é o que ela sabe de facto. */
  try {
    const w0 = f.contentWindow;
    const capa = w0.document.querySelector('.cover__img');
    if (capa && capa.currentSrc) {
      const foto = new w0.Image();
      foto.src = capa.currentSrc;
      await new Promise(r => { foto.onload = r; foto.onerror = r; setTimeout(r, 6000); });
      if (foto.naturalWidth) w0.__capaFoto = foto;
    }
  } catch (e) { /* outra origem não acontece aqui; se acontecer, a verificação acusa */ }
  try {
    const w = f.contentWindow;
    const s = w.document.createElement('script');
    s.src = BASE + '/_battery.js?v=' + L + Math.floor(performance.now());
    w.document.head.appendChild(s);
    await new Promise(r => { s.onload = r; setTimeout(r, 2500); });
    window.__resultados[pag] = w.__bateria();
  } catch (e) { window.__resultados[pag] = { erro: String(e) }; }
  f.remove();
  saida.textContent = Object.keys(window.__resultados).length + '/' + PAGINAS.length;
}
window.__pronto = true;
saida.textContent = `pronto: ${Object.keys(window.__resultados).length} páginas a ${L}x${A}`;
</script>
