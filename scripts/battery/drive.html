<!doctype html><meta charset=utf-8><title>bateria</title>
<body style="font:13px/1.5 ui-monospace,monospace;padding:1rem">
<div id=saida>a correr…</div>
<script type=module>
const PAGINAS = ['/','/lamps/','/lamps/fox/','/lamps/mushroom/',
 '/cathelier/','/cathelier/christmas/','/cathelier/keepsakes/','/cathelier/pieces/',
 '/cathelier/pieces/growth-chart/','/cathelier/pieces/engraved-bauble/',
 '/cart/','/contact/','/about/','/cathelier/about/','/cathelier/quote/',
 '/thank-you/','/order-cancelled/','/care-and-safety/','/legal/terms/','/legal/privacy/','/legal/cancellation/',
 '/legal/shipping-and-returns/','/legal/identification/','/legal/returns-form/','/404.html'];
window.__resultados = {};
const saida = document.getElementById('saida');
const L = Number(new URLSearchParams(location.search).get('w') || 1280);

/* A ALTURA importa tanto como a largura, e durante todo o projecto foi 900.
 *
 * A verificação «o menu de telemóvel cabe no ecrã sem rolar» compara o
 * conteúdo da gaveta com `innerHeight` DENTRO do iframe. Com o iframe sempre
 * a 900 px, essa comparação era `578 <= 901`: verdadeira para qualquer
 * telemóvel que exista. A guarda não podia falhar, e por isso não falhou —
 * enquanto a gaveta da cathelier transborda hoje, em produção, num ecrã de
 * 568 px.
 *
 * Cada largura passa a trazer a altura do aparelho que ela representa. É a
 * segunda vez neste projecto que uma guarda mede contra um número escolhido
 * por conveniência e devolve um ✓ sobre o que nunca viu. */
/* 1366x640 é o caso mais apertado que existe e ninguém o conduzia: a media
   query de compactação é `(height < 40rem)`, que NÃO casa em 640 exactos, e o
   conteúdo em repouso do painel cathelier mede 599px. Quarenta e um pixels de
   folga, sem guarda nenhuma até aqui. */
const ALTURAS = { 320: 568, 375: 667, 390: 844, 768: 1024, 1280: 800, 1366: 640, 1440: 900 };
const A = Number(new URLSearchParams(location.search).get('h') || ALTURAS[L] || 900);

/* O carrinho é SEMEADO antes de começar.
 *
 * Com o carrinho vazio, `/carrinho/` e `/encomenda/` são duas páginas com uma
 * frase cada, e a bateria dava-as por boas durante três larguras seguidas. Só
 * quando um teste manual deixou dois artigos no `localStorage` é que
 * apareceram as ligações de 19 px que faltavam à norma dos alvos de toque.
 * Uma peça de cada marca, para o agrupamento por marca também ser pintado. */
const CESTO = 'ic-basket-v1';
const guardado = localStorage.getItem(CESTO);
localStorage.setItem(CESTO, JSON.stringify({
  country: 'PT',
  lines: [
    { id: 'fox', qty: 1, options: { power: 'batteries' } },
    { id: 'save-the-date', qty: 2, options: { engraving: 'Ana and John · 12.09.2027' } },
  ],
}));
// E respondido o aviso de cookies: senão tapa o fundo de todas as páginas e
// as medidas de contraste e de alvos leem-no a ele em vez do conteúdo.
// no cookie banner on this build: there is nothing to consent to
addEventListener('beforeunload', () => {
  if (guardado) localStorage.setItem(CESTO, guardado); else localStorage.removeItem(CESTO);
});
/* A ORIGEM também é um parâmetro, e não era.
 *
 * A bateria sempre conduziu o `localhost`, onde o prefixo de endereço é vazio.
 * A versão publicada vive debaixo de uma pasta e tem endereços diferentes — e
 * foi exactamente aí que oito @font-face saíram sem prefixo e todas as
 * tipografias 404aram, com a verificação «tipo carregado» a passar em verde no
 * local. Verificar contra um endereço diferente daquele para onde se publica
 * não é verificar.
 *
 *   /_drive.html?w=390                          o site local
 *   /_drive.html?w=390&base=/ithos-cathelier    o mesmo HTML publicado
 */
const BASE = (new URLSearchParams(location.search).get('base') || '').replace(/\/$/, '');

/* --- o cabeçalho a encolher, medido quadro a quadro -------------------------
 *
 * Isto vive no CONDUTOR e não na bateria por uma razão simples: `__bateria()`
 * é síncrona e devolve os resultados, e não há forma de esperar por quadros lá
 * dentro. E corre DEPOIS da bateria, nunca antes: encolher o cabeçalho em
 * scrollY 0 tira 22 a 34px do topo do documento e sobe a página inteira, o que
 * entregaria geometria deslocada a todas as verificações seguintes.
 *
 * O que mede é o voo, não as pontas. As pontas passam sempre — os dois estados
 * estão certos desde o início. O que estava errado era o meio: a marca saltava
 * de 61px para 40px num único quadro enquanto a barra planava 200ms à volta
 * dela. Uma verificação que só olhasse para o princípio e o fim nunca veria.
 */
/* Há quadros neste ambiente? Pergunta-se UMA vez.
 *
 * Sem `requestAnimationFrame` não há transição nenhuma para medir, e a
 * verificação do encolher acusaria vinte falhas que são do medidor e não do
 * site — ruído que esconde as verdadeiras, que é como as guardas cegas deste
 * projecto sempre começaram. Mas saltá-las em silêncio é pior. Então: uma
 * falha, alta e clara, sobre o AMBIENTE, e as verificações do voo ficam por
 * fazer com isso dito. */
let TEMOS_QUADROS = null;
async function haQuadros() {
  if (TEMOS_QUADROS !== null) return TEMOS_QUADROS;
  let n = 0;
  await new Promise((fim) => {
    const t = setTimeout(fim, 500);
    const tick = () => { n++; if (n < 3) requestAnimationFrame(tick); else { clearTimeout(t); fim(); } };
    requestAnimationFrame(tick);
  });
  TEMOS_QUADROS = n >= 3;
  if (!TEMOS_QUADROS) {
    const r = { ok: false, o: 'o ambiente dá quadros para medir animações',
      detalhe: `${n} quadros em 500ms — o painel do browser não está a desenhar, e o voo do cabeçalho fica por medir` };
    window.__resultados['(ambiente)'] = { total: 1, falhas: [r], tudo: [r] };
  }
  return TEMOS_QUADROS;
}

async function medirEncolher(w, res) {
  if (!res || !res.tudo) return;
  if (!await haQuadros()) return;
  const d = w.document;
  const head = d.querySelector('.head');
  const row = d.querySelector('.head__row');
  const mark = d.querySelector('.head__mark img');
  if (!head || !row || !mark) return;

  const nota = (ok, o, detalhe = '') => {
    const r = { ok: !!ok, o, detalhe: String(detalhe).slice(0, 180) };
    res.tudo.push(r); res.total = res.tudo.length;
    if (!ok) res.falhas.push(r);
  };

  const era = head.dataset.shrunk;
  head.dataset.anim = 'yes';        // o condutor nunca rola, por isso nunca se armou sozinho
  head.dataset.shrunk = 'no';
  // NUNCA esperar por um rAF sem prazo: num documento que não está a ser
  // desenhado ele não dispara, e o condutor fica preso para sempre. Ficou —
  // uma página em setenta segundos, sem erro nenhum, só parado.
  await new Promise((r) => { w.requestAnimationFrame(r); setTimeout(r, 400); });
  const alt = () => [row.getBoundingClientRect().height, mark.getBoundingClientRect().height];
  const inicio = alt();

  head.dataset.shrunk = 'yes';
  const amostras = [];
  await new Promise((fim) => {
    const limite = performance.now() + 700;
    const tick = () => {
      amostras.push(alt());
      if (performance.now() < limite && amostras.length < 60) w.requestAnimationFrame(tick);
      else fim();
    };
    w.requestAnimationFrame(tick);
    // O rAF não dispara de todo num documento que não está a ser desenhado.
    // Isso tem de aparecer como FALHA e não como silêncio: uma pergunta que
    // desaparece é como esta bateria ficou cega à gaveta o projecto inteiro.
    setTimeout(fim, 1400);
  });
  const fim = alt();
  head.dataset.shrunk = era;        // o valor do MARKUP, não 'no' às cegas

  nota(amostras.length >= 6, 'houve quadros para medir o encolher do cabeçalho',
    `${amostras.length} amostras`);
  if (amostras.length < 6) return;

  const distintas = new Set(amostras.map((a) => Math.round(a[0]))).size;
  nota(distintas >= 4, 'o cabeçalho passa por várias alturas a caminho',
    `${distintas} alturas distintas entre ${Math.round(inicio[0])} e ${Math.round(fim[0])}`);

  const p = (de, para, agora) => (Math.abs(de - para) < 0.5 ? null : (de - agora) / (de - para));
  const viajaAMarca = Math.abs(inicio[1] - fim[1]) > 2;
  if (viajaAMarca) {
    let pior = 0, onde = '';
    for (const [h, m] of amostras) {
      const a = p(inicio[0], fim[0], h), b = p(inicio[1], fim[1], m);
      if (a === null || b === null) continue;
      const dif = Math.abs(a - b);
      if (dif > pior) { pior = dif; onde = `barra ${a.toFixed(2)} vs marca ${b.toFixed(2)}`; }
    }
    nota(pior <= 0.08, 'a barra e a marca encolhem ao mesmo passo',
      `pior desvio ${(pior * 100).toFixed(1)}% (${onde})`);
  } else {
    // A marca da cathelier abaixo de 800px já está no seu tamanho encolhido:
    // `clamp(40px, 5vw, 54px)` só chega a 40 aos 800. Perguntar «encolhe ao
    // mesmo passo» ali não tem resposta, por isso pergunta-se a outra.
    const constante = new Set(amostras.map((a) => Math.round(a[1]))).size === 1;
    nota(constante, 'a marca, que aqui já está no tamanho pequeno, não se mexe',
      `${new Set(amostras.map((a) => Math.round(a[1]))).size} alturas`);
  }

  const manda = amostras.every(([h, m]) => h >= m + 8);
  nota(manda, 'o min-height continua a mandar na altura durante o voo',
    manda ? '' : amostras.filter(([h, m]) => h < m + 8).slice(0, 2).map(([h, m]) => `${h.toFixed(1)} vs ${m.toFixed(1)}`).join(' · '));
}

/* --- a deriva das fotografias do cartão -------------------------------------
 *
 * Conduz um cartão a sério: entra com o ponteiro, espera a primeira troca, e
 * pergunta o que não se pode saber de outra maneira. As URLs que esta
 * funcionalidade pede são compostas em tempo de execução a partir do srcset —
 * não estão em HTML nenhum, por isso o check-output não as vê, e a bateria só
 * conhece uma imagem depois de alguém a ter pedido. Ninguém passa o rato por
 * cima de nada excepto isto.
 */
async function medirDeriva(w, res) {
  if (!res || !res.tudo) return;
  if (!await haQuadros()) return;
  const d = w.document;
  const card = [...d.querySelectorAll('[data-shots]')]
    .find((c) => (c.dataset.shots || '').split(',').filter(Boolean).length > 1);
  if (!card) return;
  if (!w.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

  const nota = (ok, o, detalhe = '') => {
    const r = { ok: !!ok, o, detalhe: String(detalhe).slice(0, 180) };
    res.tudo.push(r); res.total = res.tudo.length;
    if (!ok) res.falhas.push(r);
  };

  const shots = card.dataset.shots.split(',').filter(Boolean);
  const dir = card.dataset.dir;
  const frame = card.querySelector('.card__frame');
  const emBaixo = () => frame.querySelector('picture:not(.over) img');
  const qual = () => {
    const im = emBaixo();
    const m = (im.currentSrc || im.src).match(/\/([^/]+)-\d+\.(avif|webp)/);
    return m ? m[1] : '';
  };

  const naCapa = qual();
  card.dispatchEvent(new w.PointerEvent('pointerenter', { bubbles: true }));
  await new Promise((r) => setTimeout(r, 4200));   // dwell + primeira + fade

  nota(qual() !== naCapa, 'ao parar o rato, o cartão passa à fotografia seguinte',
    `começou em ${naCapa}, está em ${qual()}`);
  nota(frame.querySelectorAll('picture').length === 2,
    'a segunda camada existe enquanto a deriva corre',
    `${frame.querySelectorAll('picture').length} camadas`);

  /* As respostas dos ficheiros que ELE foi buscar — a única forma de um
     rendition em falta aparecer alguma vez num teste de browser. */
  const pedidas = w.performance.getEntriesByType('resource')
    .filter((r) => r.name.includes(dir));
  const mas = pedidas.filter((r) => r.responseStatus >= 400).map((r) => r.name.split('/').pop());
  nota(mas.length === 0, 'as fotografias que a deriva pede respondem todas',
    `${pedidas.length} pedidas · ${mas.slice(0, 3).join(', ')}`);

  card.dispatchEvent(new w.PointerEvent('pointerleave', { bubbles: true }));
  await new Promise((r) => setTimeout(r, 1200));
  nota(frame.querySelectorAll('picture').length === 1,
    'ao sair, o cartão fica com uma camada só',
    `${frame.querySelectorAll('picture').length} camadas`);
  nota(qual() === shots[0], 'ao sair, volta à capa', `${qual()} (capa ${shots[0]})`);

  /* E o que a marcação promete a quem não vê: uma âncora fora da árvore de
     acessibilidade não pode continuar a apanhar o foco. */
  const escondidosFocaveis = [...d.querySelectorAll('[aria-hidden="true"]')]
    .filter((e) => e.matches('a[href], button, input, select, textarea')
      && e.getAttribute('tabindex') !== '-1');
  nota(escondidosFocaveis.length === 0,
    'nada escondido dos leitores de ecrã continua a apanhar o foco',
    escondidosFocaveis.slice(0, 3).map((e) => e.tagName + '.' + e.className).join(', '));
}

for (const pag of PAGINAS) {
  const f = document.createElement('iframe');
  f.style.cssText = `width:${L}px;height:${A}px;border:0;position:absolute;left:-9999px`;
  f.src = BASE + pag;
  document.body.appendChild(f);
  await new Promise(r => { f.onload = r; setTimeout(r, 4000); });
  await new Promise(r => setTimeout(r, 900));

  /* A fotografia da capa, descodificada aqui e entregue à bateria.
   *
   * A verificação do contraste da capa desenha a fotografia numa tela, e uma
   * tela vazia não tem cor nenhuma — mediria o painel sobre preto e diria que
   * está tudo bem. Mas não se pode esperar pela própria `<img>` da página:
   * numa moldura fora do ecrã o browser troca de candidato do `srcset` a meio
   * e fica com `complete` a verdade e `naturalWidth` a zero, e assim ficou
   * seis segundos seguidos nas duas corridas em que isto foi medido.
   *
   * Uma imagem NOVA com o mesmo endereço, sem `srcset`, descodifica à
   * primeira. É essa que a bateria usa; a `<img>` da página continua a dar a
   * geometria, que é o que ela sabe de facto. */
  try {
    const w0 = f.contentWindow;
    const capa = w0.document.querySelector('.cover__img');
    if (capa && capa.currentSrc) {
      const foto = new w0.Image();
      foto.src = capa.currentSrc;
      await new Promise(r => { foto.onload = r; foto.onerror = r; setTimeout(r, 6000); });
      if (foto.naturalWidth) w0.__capaFoto = foto;
    }
  } catch (e) { /* outra origem não acontece aqui; se acontecer, a verificação acusa */ }
  try {
    const w = f.contentWindow;
    const s = w.document.createElement('script');
    s.src = BASE + '/_battery.js?v=' + L + Math.floor(performance.now());
    w.document.head.appendChild(s);
    await new Promise(r => { s.onload = r; setTimeout(r, 2500); });
    window.__resultados[pag] = w.__bateria();
    await medirEncolher(w, window.__resultados[pag]);
    await medirDeriva(w, window.__resultados[pag]);
  } catch (e) { window.__resultados[pag] = { erro: String(e) }; }
  f.remove();
  saida.textContent = Object.keys(window.__resultados).length + '/' + PAGINAS.length;
}
window.__pronto = true;
saida.textContent = `pronto: ${Object.keys(window.__resultados).length} páginas a ${L}x${A}`;
</script>
