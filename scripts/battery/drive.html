<!doctype html><meta charset=utf-8><title>bateria</title>
<body style="font:13px/1.5 ui-monospace,monospace;padding:1rem">
<div id=saida>a correr…</div>
<script type=module>
const PAGINAS = ['/','/lamps/','/lamps/fox/','/lamps/mushroom/',
 /* As duas moradas com `#` são a mesma página que a terceira, e é esse o
    ponto: as páginas de ocasião morreram e os círculos da home levam agora à
    lista com o filtro no fragmento. O HTML é idêntico nos três casos, por isso
    ninguém mais consegue verificar isto -- só quem corre o browser. */
 '/cathelier/','/cathelier/pieces/#christmas','/cathelier/pieces/#keepsakes','/cathelier/pieces/#custom','/cathelier/pieces/',
 '/cathelier/pieces/growth-chart/','/cathelier/pieces/engraved-bauble/',
 '/cart/','/contact/','/about/','/cathelier/about/','/cathelier/quote/',
 '/thank-you/','/order-cancelled/','/care-and-safety/','/legal/terms/','/legal/privacy/','/legal/cancellation/',
 '/legal/shipping-and-returns/','/legal/identification/','/legal/returns-form/','/404.html',
 /* And the SAME pages in the other shop's dress. Eight pages are now written
    twice, and a copy is a page like any other: it has to hold its contrast,
    its tap targets and its menu. Two of the eight are driven here; measuring
    all sixteen would double the run for very little, since the bodies are
    byte-identical and only the frame differs. */
 '/cathelier/contact/','/cathelier/legal/terms/','/cathelier/cart/'];
window.__resultados = {};
const saida = document.getElementById('saida');
const L = Number(new URLSearchParams(location.search).get('w') || 1280);

/* A ALTURA importa tanto como a largura, e durante todo o projecto foi 900.
 *
 * A verificação «o menu de telemóvel cabe no ecrã sem rolar» compara o
 * conteúdo da gaveta com `innerHeight` DENTRO do iframe. Com o iframe sempre
 * a 900 px, essa comparação era `578 <= 901`: verdadeira para qualquer
 * telemóvel que exista. A guarda não podia falhar, e por isso não falhou —
 * enquanto a gaveta da cathelier transborda hoje, em produção, num ecrã de
 * 568 px.
 *
 * Cada largura passa a trazer a altura do aparelho que ela representa. É a
 * segunda vez neste projecto que uma guarda mede contra um número escolhido
 * por conveniência e devolve um ✓ sobre o que nunca viu. */
/* 1366x640 é o caso mais apertado que existe e ninguém o conduzia: a media
   query de compactação é `(height < 40rem)`, que NÃO casa em 640 exactos, e o
   conteúdo em repouso do painel cathelier mede 599px. Quarenta e um pixels de
   folga, sem guarda nenhuma até aqui. */
/* 1920x1080 NÃO É MAIS UM TAMANHO GRANDE: é a forma que apanha uma classe de
   defeitos que nenhuma das outras apanha. A capa é `aspect-ratio: 16/9`
   travada por `max-block-size: calc(100svh - 3rem)`, e o travão só morde
   quando `largura/16*9 > altura-48`. A 1280x800 dá 720 contra 752 e a
   proporção ganha -- a capa nunca chega ao travão, e a barra escura que a dona
   viu a 1905x1005 era invisível a todas as larguras que esta lista tinha. */
const ALTURAS = { 320: 568, 375: 667, 390: 844, 768: 1024, 1280: 800, 1366: 640, 1440: 900, 1920: 1080 };
const A = Number(new URLSearchParams(location.search).get('h') || ALTURAS[L] || 900);

/* O carrinho é SEMEADO antes de começar.
 *
 * Com o carrinho vazio, `/carrinho/` e `/encomenda/` são duas páginas com uma
 * frase cada, e a bateria dava-as por boas durante três larguras seguidas. Só
 * quando um teste manual deixou dois artigos no `localStorage` é que
 * apareceram as ligações de 19 px que faltavam à norma dos alvos de toque.
 * Uma peça de cada marca, para o agrupamento por marca também ser pintado. */
const CESTO = 'ic-basket-v1';
const guardado = localStorage.getItem(CESTO);
localStorage.setItem(CESTO, JSON.stringify({
  country: 'PT',
  lines: [
    { id: 'fox', qty: 1, options: { power: 'batteries' } },
    { id: 'save-the-date', qty: 2, options: { engraving: 'Ana and John · 12.09.2027' } },
  ],
}));
// E respondido o aviso de cookies: senão tapa o fundo de todas as páginas e
// as medidas de contraste e de alvos leem-no a ele em vez do conteúdo.
// no cookie banner on this build: there is nothing to consent to
addEventListener('beforeunload', () => {
  if (guardado) localStorage.setItem(CESTO, guardado); else localStorage.removeItem(CESTO);
});
/* A ORIGEM também é um parâmetro, e não era.
 *
 * A bateria sempre conduziu o `localhost`, onde o prefixo de endereço é vazio.
 * A versão publicada vive debaixo de uma pasta e tem endereços diferentes — e
 * foi exactamente aí que oito @font-face saíram sem prefixo e todas as
 * tipografias 404aram, com a verificação «tipo carregado» a passar em verde no
 * local. Verificar contra um endereço diferente daquele para onde se publica
 * não é verificar.
 *
 *   /_drive.html?w=390                          o site local
 *   /_drive.html?w=390&base=/ithos-cathelier    o mesmo HTML publicado
 */
const BASE = (new URLSearchParams(location.search).get('base') || '').replace(/\/$/, '');

/* --- o cabeçalho a encolher, medido quadro a quadro -------------------------
 *
 * Isto vive no CONDUTOR e não na bateria por uma razão simples: `__bateria()`
 * é síncrona e devolve os resultados, e não há forma de esperar por quadros lá
 * dentro. E corre DEPOIS da bateria, nunca antes: encolher o cabeçalho em
 * scrollY 0 tira 22 a 34px do topo do documento e sobe a página inteira, o que
 * entregaria geometria deslocada a todas as verificações seguintes.
 *
 * O que mede é o voo, não as pontas. As pontas passam sempre — os dois estados
 * estão certos desde o início. O que estava errado era o meio: a marca saltava
 * de 61px para 40px num único quadro enquanto a barra planava 200ms à volta
 * dela. Uma verificação que só olhasse para o princípio e o fim nunca veria.
 */
/* Há quadros neste ambiente? Pergunta-se UMA vez.
 *
 * Sem `requestAnimationFrame` não há transição nenhuma para medir, e a
 * verificação do encolher acusaria vinte falhas que são do medidor e não do
 * site — ruído que esconde as verdadeiras, que é como as guardas cegas deste
 * projecto sempre começaram. Mas saltá-las em silêncio é pior. Então: uma
 * falha, alta e clara, sobre o AMBIENTE, e as verificações do voo ficam por
 * fazer com isso dito. */
let TEMOS_QUADROS = null;
async function haQuadros() {
  if (TEMOS_QUADROS !== null) return TEMOS_QUADROS;
  let n = 0;
  await new Promise((fim) => {
    const t = setTimeout(fim, 500);
    const tick = () => { n++; if (n < 3) requestAnimationFrame(tick); else { clearTimeout(t); fim(); } };
    requestAnimationFrame(tick);
  });
  TEMOS_QUADROS = n >= 3;
  if (!TEMOS_QUADROS) {
    const r = { ok: false, o: 'o ambiente dá quadros para medir animações',
      detalhe: `${n} quadros em 500ms — o painel do browser não está a desenhar, e o voo do cabeçalho fica por medir` };
    window.__resultados['(ambiente)'] = { total: 1, falhas: [r], tudo: [r] };
  }
  return TEMOS_QUADROS;
}

async function medirEncolher(w, res) {
  if (!res || !res.tudo) return;
  if (!await haQuadros()) return;
  const d = w.document;
  const head = d.querySelector('.head');
  const row = d.querySelector('.head__row');
  const mark = d.querySelector('.head__mark img');
  if (!head || !row || !mark) return;

  const nota = (ok, o, detalhe = '') => {
    const r = { ok: !!ok, o, detalhe: String(detalhe).slice(0, 180) };
    res.tudo.push(r); res.total = res.tudo.length;
    if (!ok) res.falhas.push(r);
  };

  const era = head.dataset.shrunk;
  head.dataset.anim = 'yes';        // o condutor nunca rola, por isso nunca se armou sozinho
  head.dataset.shrunk = 'no';
  // NUNCA esperar por um rAF sem prazo: num documento que não está a ser
  // desenhado ele não dispara, e o condutor fica preso para sempre. Ficou —
  // uma página em setenta segundos, sem erro nenhum, só parado.
  await new Promise((r) => { w.requestAnimationFrame(r); setTimeout(r, 400); });
  const alt = () => [row.getBoundingClientRect().height, mark.getBoundingClientRect().height];
  const inicio = alt();

  head.dataset.shrunk = 'yes';
  const amostras = [];
  await new Promise((fim) => {
    const limite = performance.now() + 700;
    const tick = () => {
      amostras.push(alt());
      if (performance.now() < limite && amostras.length < 60) w.requestAnimationFrame(tick);
      else fim();
    };
    w.requestAnimationFrame(tick);
    // O rAF não dispara de todo num documento que não está a ser desenhado.
    // Isso tem de aparecer como FALHA e não como silêncio: uma pergunta que
    // desaparece é como esta bateria ficou cega à gaveta o projecto inteiro.
    setTimeout(fim, 1400);
  });
  const fim = alt();
  head.dataset.shrunk = era;        // o valor do MARKUP, não 'no' às cegas

  nota(amostras.length >= 6, 'houve quadros para medir o encolher do cabeçalho',
    `${amostras.length} amostras`);
  if (amostras.length < 6) return;

  const distintas = new Set(amostras.map((a) => Math.round(a[0]))).size;
  nota(distintas >= 4, 'o cabeçalho passa por várias alturas a caminho',
    `${distintas} alturas distintas entre ${Math.round(inicio[0])} e ${Math.round(fim[0])}`);

  const p = (de, para, agora) => (Math.abs(de - para) < 0.5 ? null : (de - agora) / (de - para));
  const viajaAMarca = Math.abs(inicio[1] - fim[1]) > 2;
  if (viajaAMarca) {
    let pior = 0, onde = '';
    for (const [h, m] of amostras) {
      const a = p(inicio[0], fim[0], h), b = p(inicio[1], fim[1], m);
      if (a === null || b === null) continue;
      const dif = Math.abs(a - b);
      if (dif > pior) { pior = dif; onde = `barra ${a.toFixed(2)} vs marca ${b.toFixed(2)}`; }
    }
    nota(pior <= 0.08, 'a barra e a marca encolhem ao mesmo passo',
      `pior desvio ${(pior * 100).toFixed(1)}% (${onde})`);
  } else {
    // A marca da cathelier abaixo de 800px já está no seu tamanho encolhido:
    // `clamp(40px, 5vw, 54px)` só chega a 40 aos 800. Perguntar «encolhe ao
    // mesmo passo» ali não tem resposta, por isso pergunta-se a outra.
    const constante = new Set(amostras.map((a) => Math.round(a[1]))).size === 1;
    nota(constante, 'a marca, que aqui já está no tamanho pequeno, não se mexe',
      `${new Set(amostras.map((a) => Math.round(a[1]))).size} alturas`);
  }

  const manda = amostras.every(([h, m]) => h >= m + 8);
  nota(manda, 'o min-height continua a mandar na altura durante o voo',
    manda ? '' : amostras.filter(([h, m]) => h < m + 8).slice(0, 2).map(([h, m]) => `${h.toFixed(1)} vs ${m.toFixed(1)}`).join(' · '));
}

/* --- a deriva das fotografias do cartão -------------------------------------
 *
 * Conduz um cartão a sério: entra com o ponteiro, espera a primeira troca, e
 * pergunta o que não se pode saber de outra maneira. As URLs que esta
 * funcionalidade pede são compostas em tempo de execução a partir do srcset —
 * não estão em HTML nenhum, por isso o check-output não as vê, e a bateria só
 * conhece uma imagem depois de alguém a ter pedido. Ninguém passa o rato por
 * cima de nada excepto isto.
 */
async function medirDeriva(w, res) {
  if (!res || !res.tudo) return;
  if (!await haQuadros()) return;
  const d = w.document;
  const card = [...d.querySelectorAll('[data-shots]')]
    .find((c) => (c.dataset.shots || '').split(',').filter(Boolean).length > 1);
  if (!card) return;
  if (!w.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

  const nota = (ok, o, detalhe = '') => {
    const r = { ok: !!ok, o, detalhe: String(detalhe).slice(0, 180) };
    res.tudo.push(r); res.total = res.tudo.length;
    if (!ok) res.falhas.push(r);
  };

  const shots = card.dataset.shots.split(',').filter(Boolean);
  const dir = card.dataset.dir;
  const frame = card.querySelector('.card__frame');
  const emBaixo = () => frame.querySelector('picture:not(.over) img');
  const qual = () => {
    const im = emBaixo();
    const m = (im.currentSrc || im.src).match(/\/([^/]+)-\d+\.(avif|webp)/);
    return m ? m[1] : '';
  };

  const naCapa = qual();
  card.dispatchEvent(new w.PointerEvent('pointerenter', { bubbles: true }));
  await new Promise((r) => setTimeout(r, 4200));   // dwell + primeira + fade

  nota(qual() !== naCapa, 'ao parar o rato, o cartão passa à fotografia seguinte',
    `começou em ${naCapa}, está em ${qual()}`);
  nota(frame.querySelectorAll('picture').length === 2,
    'a segunda camada existe enquanto a deriva corre',
    `${frame.querySelectorAll('picture').length} camadas`);

  /* As respostas dos ficheiros que ELE foi buscar — a única forma de um
     rendition em falta aparecer alguma vez num teste de browser. */
  const pedidas = w.performance.getEntriesByType('resource')
    .filter((r) => r.name.includes(dir));
  const mas = pedidas.filter((r) => r.responseStatus >= 400).map((r) => r.name.split('/').pop());
  nota(mas.length === 0, 'as fotografias que a deriva pede respondem todas',
    `${pedidas.length} pedidas · ${mas.slice(0, 3).join(', ')}`);

  card.dispatchEvent(new w.PointerEvent('pointerleave', { bubbles: true }));
  await new Promise((r) => setTimeout(r, 1200));
  nota(frame.querySelectorAll('picture').length === 1,
    'ao sair, o cartão fica com uma camada só',
    `${frame.querySelectorAll('picture').length} camadas`);
  nota(qual() === shots[0], 'ao sair, volta à capa', `${qual()} (capa ${shots[0]})`);

  /* E o que a marcação promete a quem não vê: uma âncora fora da árvore de
     acessibilidade não pode continuar a apanhar o foco. */
  const escondidosFocaveis = [...d.querySelectorAll('[aria-hidden="true"]')]
    .filter((e) => e.matches('a[href], button, input, select, textarea')
      && e.getAttribute('tabindex') !== '-1');
  nota(escondidosFocaveis.length === 0,
    'nada escondido dos leitores de ecrã continua a apanhar o foco',
    escondidosFocaveis.slice(0, 3).map((e) => e.tagName + '.' + e.className).join(', '));
}

/* --- a fotografia do produto, e o ampliar ----------------------------------
 * A pergunta é uma só e pode falhar dos dois lados: o que está pintado tem a
 * forma do ficheiro? Com `object-fit: contain` a caixa pode ser maior do que a
 * fotografia, por isso mede-se a ÁREA PINTADA e não a caixa — foi a distinção
 * que apanhou a moldura a ser reconstruída em quadrado por uma tampa de altura.
 */
async function medirFotografia(w, res) {
  if (!res || !res.tudo) return;
  /* Sem quadros não há geometria pintada para medir, e uma <img> num documento
     que não está a ser desenhado fica com `naturalWidth` a zero sem que nada
     esteja errado com o site. Isso já é dito UMA vez, alto, sobre o ambiente;
     repeti-lo aqui seriam cinco falhas enganadoras por corrida. */
  if (!await haQuadros()) return;
  const d = w.document;
  const slide = d.querySelector('.gallery__slide img, .product__gallery .frame img');
  if (!slide) return;

  const nota = (ok, o, detalhe = '') => {
    const r = { ok: !!ok, o, detalhe: String(detalhe).slice(0, 180) };
    res.tudo.push(r); res.total = res.tudo.length;
    if (!ok) res.falhas.push(r);
  };

  if (!slide.naturalWidth) {
    await new Promise((r) => { slide.addEventListener('load', r, { once: true }); setTimeout(r, 2500); });
  }
  if (!slide.naturalWidth) {
    /* A prova de que uma imagem falhou é o ESTADO DA RESPOSTA, não o
       naturalWidth -- a bateria aprendeu isso com três imagens "partidas" que
       carregavam bem. */
    const pedido = w.performance.getEntriesByType('resource')
      .find((e) => e.name === (slide.currentSrc || slide.src));
    nota(false, 'a fotografia do produto carregou',
      pedido ? `resposta ${pedido.responseStatus}` : 'nunca chegou a ser pedida');
    return;
  }
  const b = slide.getBoundingClientRect();
  const doFicheiro = slide.naturalWidth / slide.naturalHeight;
  const k = Math.min(b.width / slide.naturalWidth, b.height / slide.naturalHeight);
  const pintada = { w: slide.naturalWidth * k, h: slide.naturalHeight * k };
  nota(Math.abs(pintada.w / pintada.h - doFicheiro) < 0.02,
    'a fotografia do produto não está cortada',
    `pintada ${(pintada.w / pintada.h).toFixed(3)} · ficheiro ${doFicheiro.toFixed(3)} · ${(slide.currentSrc || slide.src).split('/').pop()}`);
  nota((slide.currentSrc || slide.src).includes('/media/whole/'),
    'a ficha serve a fotografia inteira e não o recorte quadrado',
    (slide.currentSrc || slide.src).split('/media/')[1] || '?');

  const abre = d.querySelector('[data-box-open]');
  nota(!!abre, 'há um botão para ver a fotografia em grande', abre ? '' : 'nenhum nesta página');
  if (!abre) return;

  abre.click();
  await new Promise((r) => setTimeout(r, 900));
  const box = d.querySelector('.lightbox');
  const grande = box && box.querySelector('img');
  nota(box && box.open && grande && grande.getBoundingClientRect().width > 0,
    'o visualizador abre com a fotografia lá dentro',
    box ? `open=${box.open} largura=${Math.round(grande ? grande.getBoundingClientRect().width : 0)}` : 'não existe');

  if (box && box.open && grande) {
    const palco = box.querySelector('.lightbox__stage');
    nota(palco.scrollWidth <= palco.clientWidth + 1 && palco.scrollHeight <= palco.clientHeight + 1,
      'no ajuste, a fotografia inteira cabe sem rolar',
      `${palco.scrollWidth}x${palco.scrollHeight} em ${palco.clientWidth}x${palco.clientHeight}`);
    const g2 = grande.getBoundingClientRect();
    nota(Math.abs(g2.width / g2.height - grande.naturalWidth / grande.naturalHeight) < 0.02,
      'no visualizador a fotografia não está esticada',
      `${(g2.width / g2.height).toFixed(3)} vs ${(grande.naturalWidth / grande.naturalHeight).toFixed(3)}`);
    d.querySelector('[data-box-close]')?.click();
    await new Promise((r) => setTimeout(r, 400));
    nota(!box.open && !d.documentElement.classList.contains('menu-open'),
      'ao fechar o visualizador a página volta a rolar',
      `open=${box.open} trava=${d.documentElement.classList.contains('menu-open')}`);
  }
}

for (const pag of PAGINAS) {
  const f = document.createElement('iframe');
  /* A MOLDURA TEM DE SER DESENHADA, e durante muito tempo não era.
   *
   * Estava em `left:-9999px`, fora de qualquer vista. Uma moldura assim não é
   * renderizada: a observação de proximidade lá dentro nunca dispara, por isso
   * as 67 miniaturas dos cartões nunca chegavam a ser construídas e a
   * verificação de imagens partidas era cega precisamente às imagens que a
   * dona fotografou partidas. O `requestAnimationFrame` também não corria, e
   * por isso o voo do cabeçalho ficava por medir em quase todas as corridas.
   *
   * Agora fica no sítio, em tamanho real, mas ATRÁS da página do condutor:
   * z-index negativo debaixo de um corpo opaco. Continua invisível a quem
   * olha, e passa a existir para o browser. */
  f.style.cssText = `width:${L}px;height:${A}px;border:0;position:fixed;`
    + `left:0;top:0;z-index:-1;pointer-events:none`;
  f.src = BASE + pag;
  document.body.appendChild(f);
  await new Promise(r => { f.onload = r; setTimeout(r, 4000); });
  await new Promise(r => setTimeout(r, 900));

  /* A fotografia da capa, descodificada aqui e entregue à bateria.
   *
   * A verificação do contraste da capa desenha a fotografia numa tela, e uma
   * tela vazia não tem cor nenhuma — mediria o painel sobre preto e diria que
   * está tudo bem. Mas não se pode esperar pela própria `<img>` da página:
   * numa moldura fora do ecrã o browser troca de candidato do `srcset` a meio
   * e fica com `complete` a verdade e `naturalWidth` a zero, e assim ficou
   * seis segundos seguidos nas duas corridas em que isto foi medido.
   *
   * Uma imagem NOVA com o mesmo endereço, sem `srcset`, descodifica à
   * primeira. É essa que a bateria usa; a `<img>` da página continua a dar a
   * geometria, que é o que ela sabe de facto. */
  /* PERCORRER A PÁGINA ANTES DE MEDIR, para as imagens preguiçosas chegarem a
   * ser pedidas.
   *
   * A verificação de imagens partidas só conhece uma imagem depois de alguma
   * coisa a ter ido buscar, e o condutor nunca rolava: numa página de
   * catálogo dizia «8 de 28 medidas» e imprimia um ✓ sobre as outras vinte.
   * A dona fotografou uma miniatura partida que nenhuma corrida teria
   * apanhado.
   *
   * Desce em passos e volta ao topo, e espera que assente: rolar mexe no
   * cabeçalho pegajoso e em tudo o que vem por baixo dele, e a geometria é
   * medida a seguir. */
  try {
    /* Percorrer a página primeiro: agora que a moldura é desenhada, descer por
       ela acorda as observações de proximidade que constroem as tiras de
       miniaturas dos cartões — 67 numa página de catálogo, que de outra forma
       nunca chegam a existir e por isso nunca são verificadas. Depois volta ao
       topo e assenta, porque rolar mexe no cabeçalho e em tudo o que vem por
       baixo, e a geometria é medida a seguir. */
    const w1 = f.contentWindow;
    const doc1 = w1.document.documentElement;
    for (let y = 0; y < doc1.scrollHeight; y += Math.round(A * 0.8)) {
      w1.scrollTo({ top: y, behavior: 'instant' });
      await new Promise((r) => setTimeout(r, 130));
    }
    w1.scrollTo({ top: 0, behavior: 'instant' });
    await new Promise((r) => setTimeout(r, 400));
    /* E só depois tirar a preguiça ao que ficou: uma imagem preguiçosa que
       nunca entrou na vista continua por pedir, e a verificação de imagens
       partidas só conhece o que alguém foi buscar. */
    const preguicosas = [...w1.document.images].filter((i) => i.loading === 'lazy');
    for (const i of preguicosas) i.loading = 'eager';
    if (preguicosas.length) {
      await new Promise((fim) => {
        const prazo = setTimeout(fim, 3000);
        let porChegar = preguicosas.filter((i) => !i.complete).length;
        if (!porChegar) { clearTimeout(prazo); fim(); return; }
        const conta = () => { if (--porChegar <= 0) { clearTimeout(prazo); fim(); } };
        for (const i of preguicosas) {
          if (i.complete) continue;
          i.addEventListener('load', conta, { once: true });
          i.addEventListener('error', conta, { once: true });
        }
      });
    }
  } catch (e) { /* mesma origem; se falhar, a cobertura aparece no denominador */ }

  try {
    const w0 = f.contentWindow;
    const capa = w0.document.querySelector('.cover__img');
    if (capa && capa.currentSrc) {
      const foto = new w0.Image();
      foto.src = capa.currentSrc;
      await new Promise(r => { foto.onload = r; foto.onerror = r; setTimeout(r, 6000); });
      if (foto.naturalWidth) w0.__capaFoto = foto;
    }
  } catch (e) { /* outra origem não acontece aqui; se acontecer, a verificação acusa */ }
  try {
    const w = f.contentWindow;
    const s = w.document.createElement('script');
    s.src = BASE + '/_battery.js?v=' + L + Math.floor(performance.now());
    w.document.head.appendChild(s);
    await new Promise(r => { s.onload = r; setTimeout(r, 2500); });
    window.__resultados[pag] = w.__bateria();
    await medirEncolher(w, window.__resultados[pag]);
    await medirDeriva(w, window.__resultados[pag]);
    await medirFotografia(w, window.__resultados[pag]);
  } catch (e) { window.__resultados[pag] = { erro: String(e) }; }
  f.remove();
  saida.textContent = Object.keys(window.__resultados).length + '/' + PAGINAS.length;
}
/* --- OS REENCAMINHAMENTOS, CONDUZIDOS ATÉ AO FIM ---------------------------
   As dez moradas antigas das ocasiões são stubs. Nada disto se vê no HTML
   servido: o ficheiro é idêntico quer o reencaminhamento funcione quer não, e
   o que decide é o browser.

   NÃO PODEM IR NA LISTA DE CIMA. O laço das páginas espera pelo `onload` e
   depois 900 ms, e um stub navega no meio disso: a bateria seria injectada no
   documento que lá estivesse nessa altura e escreveria uma página inteira de
   vistos verdes sob a chave do stub -- medindo o DESTINO e chamando-lhe a
   origem. Já aconteceu neste repositório, com o /404.html a receber vistos por
   uma morada apagada.

   O destino esperado sai do PRÓPRIO stub (o `href` do link de recurso), e não
   de uma segunda cópia da tabela aqui: o check-output já garante que esse href
   é o que src/lib/redirects.mjs manda. Uma lista só, e ninguém a repetir. */
const STUBS = ['/cathelier/christmas/','/cathelier/mothers-day/','/cathelier/fathers-day/',
 '/cathelier/childrens-day/','/cathelier/keepsakes/','/cathelier/new-baby/','/cathelier/names/',
 '/cathelier/home/','/cathelier/hanging/','/cathelier/awards/'];

for (const de of STUBS) {
  const R = [];
  const nota = (ok, o, d = '') => R.push({ ok: !!ok, o, d });
  try {
    // Primeiro o documento do stub, lido SEM o executar, para saber o que ele promete.
    const bruto = await (await fetch(BASE + de)).text();
    const promete = bruto.match(/<a id="go" href="([^"]+)"/)?.[1];
    nota(promete, 'o stub diz para onde vai', promete || 'não tem link nenhum');

    const f = document.createElement('iframe');
    f.style.cssText = `width:${L}px;height:${A}px;border:0;position:fixed;left:0;top:0;z-index:-1;pointer-events:none`;
    f.src = BASE + de;
    document.body.appendChild(f);
    // Esperar pela MUDANÇA e não por um relógio: o reencaminhamento pode
    // chegar antes ou depois do primeiro onload, e um `setTimeout` fixo
    // transforma «ainda não» em «não».
    let onde = '';
    for (let i = 0; i < 60; i++) {
      await new Promise(r => setTimeout(r, 100));
      try { onde = f.contentWindow.location.pathname + f.contentWindow.location.hash; } catch (e) { onde = '(outra origem)'; }
      if (onde && onde !== BASE + de) break;
    }
    nota(onde === promete, 'e o browser vai mesmo lá parar', `ficou em ${onde}`);
    nota(onde !== BASE + de, 'não ficou parado no stub', onde);

    // E, chegado lá, o filtro certo está posto. É o fim da promessa toda:
    // a morada antiga dá a lista filtrada pela ocasião que lá estava.
    const d = f.contentDocument;
    const querido = (promete || '').split('#')[1] || '';
    const chips = [...d.querySelectorAll('[data-filter]')];
    const premido = chips.filter(c => c.getAttribute('aria-pressed') === 'true').map(c => c.dataset.filter);
    nota(premido.length === 1 && premido[0] === querido,
      'e com o filtro da ocasião já escolhido', `premidos: ${premido.join(', ') || 'nenhum'}`);
    const cartoes = [...d.querySelectorAll('[data-family]')];
    const vistos = cartoes.filter(c => c.style.display !== 'none');
    nota(cartoes.length > 0 && vistos.length > 0 && vistos.length < cartoes.length,
      'e a lista encolhida sem ficar vazia', `${vistos.length} de ${cartoes.length}`);
    f.remove();
  } catch (e) { nota(false, 'o reencaminhamento correu sem rebentar', String(e)); }
  window.__resultados[de] = { total: R.length, falhas: R.filter(x => !x.ok), tudo: R };
  saida.textContent = Object.keys(window.__resultados).length + '/' + (PAGINAS.length + STUBS.length);
}

window.__pronto = true;
/* UMA PÁGINA QUE REBENTOU NÃO É UMA PÁGINA MEDIDA.
   Isto dizia só quantas páginas correram, e a 25 set 2026 escreveu «pronto: 38
   páginas» com as TRINTA E OITO a devolverem
   `TypeError: w.__bateria is not a function` -- o ficheiro estava servido com
   outro nome e nenhuma asserção chegou a correr. Um fim verde por cima de
   trinta e oito falhas é pior do que um erro: é uma bateria a dizer que
   mediu o que nunca viu. Agora os erros vão à frente e em maiúsculas. */
const rebentadas = Object.entries(window.__resultados).filter(([, v]) => v && v.erro);
saida.textContent = rebentadas.length
  ? `${rebentadas.length} DE ${Object.keys(window.__resultados).length} PÁGINAS REBENTARAM — `
    + `${rebentadas[0][0]}: ${rebentadas[0][1].erro}`
  : `pronto: ${Object.keys(window.__resultados).length} páginas e stubs a ${L}x${A}`;
</script>
